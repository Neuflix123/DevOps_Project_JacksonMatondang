<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DevOps Blog</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      color: #333;
      background: #fff;
    }
    header {
      padding: 20px 30px;
      background: #f2f2f2;
      font-weight: bold;
    }
    main {
      max-width: 760px;
      margin: 55px auto;
      padding: 0 20px;
    }
    h1 {
      text-align: center;
      font-size: 48px;
      margin-bottom: 45px;
    }
    .banner {
      background: #f3f3f3;
      padding: 25px 20px;
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 50px;
    }
    article h2 { font-size: 30px; }
    .meta { color: #888; font-size: 14px; }
    .read-more {
      display: inline-block;
      margin-top: 15px;
      color: #333;
      font-weight: bold;
    }
    @media (max-width: 600px) {
      h1 { font-size: 36px; }
      article h2 { font-size: 25px; }
    }
  </style>
</head>
<body>
  <header>DevOps Blog</header>
  <main>
    <h1>DevOps Blog</h1>
    <div class="banner">Start DevOps journey now!</div>
    {{ range where .Site.RegularPages "Section" "post" }}
    <article>
      <h2>{{ .Title }}</h2>
      <p class="meta">
        Posted on {{ .Date.Format "January 2, 2006" }}
      </p>
      <p>{{ .Summary }}</p>
      <a class="read-more" href="{{ .RelPermalink }}">[Read More]</a>
    </article>
    {{ end }}
  </main>
</body>
</html>
